name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default for all jobs; the deploy job widens its own scope.
permissions:
  contents: read

jobs:
  build-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            auto-optimise-store = true
            experimental-features = nix-command flakes

      - name: Build with cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hakyll-nix-template
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: result/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-nix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # OIDC-based deployment to GitHub Pages: `pages: write` publishes the site
    # and `id-token: write` lets the job mint the short-lived OIDC token that
    # actions/deploy-pages exchanges for scoped access.
    permissions:
      pages: write
      id-token: write

    # Serialize deployments so two pushes to main can't race; never cancel a
    # deploy that is already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
